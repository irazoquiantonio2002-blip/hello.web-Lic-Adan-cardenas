<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-labelledby="title desc">
  <title id="title">Lic. Adán Cárdenas</title>
  <desc id="desc">Logo de Lic. Adán Cárdenas, especialista de lo familiar desde 1997</desc>
  <defs>
