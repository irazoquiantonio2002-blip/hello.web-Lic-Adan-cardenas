    <line x1="550" y1="198" x2="510" y2="322" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <line x1="550" y1="198" x2="590" y2="322" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
