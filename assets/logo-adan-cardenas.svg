  <text x="380" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#gold)">Lic. Adán Cárdenas</text>
  <text x="380" y="456" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#f4e4a2" letter-spacing="2">ESPECIALISTA DE LO FAMILIAR DESDE 1997</text>
